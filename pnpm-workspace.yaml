packages:
  - .

# pnpm's minimumReleaseAge policy rejects lockfile entries published within the
# cutoff window. The tsdown/rolldown toolchain in pnpm-lock.yaml was published
# inside that window, so `pnpm install` in a fresh clone would otherwise fail
# with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. Exempt only those packages rather
# than switching the policy off for everything.
minimumReleaseAgeExclude:
  - rolldown
  - '@rolldown/*'

allowBuilds:
  '@google/genai': true
  protobufjs: true
